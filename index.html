<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <h1>TETRIS</h1>
    <div class="game">
      <div class="board-holder">
        <canvas id="board" width="300" height="600"></canvas>
        <div id="overlay" class="overlay">
          <p id="overlay-text">Press ENTER to start</p>
        </div>
      </div>
      <aside class="panel">
        <div class="box">
          <h2>Next</h2>
          <canvas id="next" width="120" height="120"></canvas>
        </div>
        <div class="box">
          <h2>Score</h2>
          <p id="score">0</p>
        </div>
        <div class="box">
          <h2>Best</h2>
          <p id="best">0</p>
        </div>
        <div class="box">
          <h2>Level</h2>
          <p id="level">1</p>
        </div>
        <div class="box">
          <h2>Lines</h2>
          <p id="lines">0</p>
        </div>
        <button id="btn" type="button">Start</button>
        <div class="box keys">
          <h2>Controls</h2>
          <ul>
            <li>&larr; / &rarr; — move</li>
            <li>&darr; — soft drop</li>
            <li>&uarr; / X — rotate</li>
            <li>Space — hard drop</li>
            <li>P — pause</li>
            <li>R — restart</li>
          </ul>
        </div>
      </aside>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
